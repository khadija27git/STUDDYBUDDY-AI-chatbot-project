     =====================================================
         BOOK PICKER LOGIC
         Fills both dropdowns from /api/books, keeps them in sync,
         remembers the choice, and adds {"book": "..."} to every
         POST to /api/chat (so chat.js needs no changes).
         Must load BEFORE script.js and chat.js.
    ======================================================
 
     <script>
    (function () {
        var KEY = "studybuddy_selected_book";
        var selects = document.querySelectorAll(".book-select");
 
        function getBook() {
            try { return localStorage.getItem(KEY) || ""; }
            catch (e) { return ""; }
        }
 
        function setBook(value) {
            try { localStorage.setItem(KEY, value || ""); } catch (e) {}
            selects.forEach(function (s) { s.value = value || ""; });
        }
 
        function prettyName(file) {
            return file.replace(/\.pdf$/i, "").replace(/[_-]+/g, " ");
        }
 
        fetch("/api/books")
            .then(function (r) { return r.json(); })
            .then(function (data) {
                (data.books || []).forEach(function (file) {
                    selects.forEach(function (select) {
                        var opt = document.createElement("option");
                        opt.value = file;
                        opt.textContent = prettyName(file);
                        select.appendChild(opt);
                    });
                });
 
                // restore saved choice only if that book still exists
                var saved = getBook();
                if ((data.books || []).indexOf(saved) === -1) saved = "";
                setBook(saved);
            })
            .catch(function () {});
 
        selects.forEach(function (select) {
            select.addEventListener("change", function () {
                setBook(select.value);
            });
        });
 
        // Add the selected book to chat requests
        var originalFetch = window.fetch;
 
        window.fetch = function (input, init) {
            try {
                var url = typeof input === "string" ? input : (input && input.url) || "";
 
                if (/\/api\/chat(\?|$)/.test(url) && init && typeof init.body === "string") {
                    var body = JSON.parse(init.body);
                    body.book = getBook() || null;
                    init = Object.assign({}, init, { body: JSON.stringify(body) });
                }
            } catch (e) {}
 
            return originalFetch.call(this, input, init);
        };
    })();
    </script> 
 
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script src="{{ url_for('static', filename='chat.js') }}"></script>
</body>
 
</html>

<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 14px;

            padding: 8px 12px;
            border-radius: 999px;
            border: 1px solid rgba(0, 0, 0, 0.15);
            background: #fff;
            font: inherit;
            max-width: 260px;
            cursor: pointer;
        }
 
        .selected-books-bar {
            display: inline-flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px;
            padding: 8px 14px;
            border-radius: 999px;

        .chat-toolbar .book-picker {
            margin-top: 0;
        }

</head>
